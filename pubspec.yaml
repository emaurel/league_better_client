name: league_better_client
description: A faster, leaner Flutter replacement for the official League of Legends client.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # LCU communication
  http: ^1.2.2
  web_socket_channel: ^3.0.1

  # Filesystem / lockfile watching
  watcher: ^1.1.0
  path: ^1.9.0

  # Windows process control + window hiding
  win32: ^5.5.4
  ffi: ^2.1.3

  # Typography
  google_fonts: ^6.2.1

  # File picking + persistence
  file_picker: ^8.1.3
  shared_preferences: ^2.3.3

  # Utilities
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
